name: Testes de Compilador

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Instalar dependências do Flex/Bison
        run: sudo apt-get update && sudo apt-get install -y flex bison libfl-dev

      - name: Buildar compilador
        run: make

      - name: Permissão de execução
        run: chmod +x ./run_tests.sh

      - name: Executar testes
        run: ./run_tests.sh
