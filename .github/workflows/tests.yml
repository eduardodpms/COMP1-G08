name: Testes de Compilador

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Buildar compilador
        run: make

      - name: Permissão de execução
        run: chmod +x ./run_tests.sh

      - name: Executar testes
        run: ./run_tests.sh
